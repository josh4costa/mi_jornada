; backend/pytest.ini  —  NUEVO
;
; La suite no tenía configuración de pytest-asyncio y conftest.py redefinía el fixture
; event_loop (deprecado en pytest-asyncio 0.24 y eliminado en 1.x).
; Con esto se declara el modo y el alcance del loop sin redefinir fixtures internas:
; borra el fixture event_loop de conftest.py al aplicar esto.

[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:passlib.*
